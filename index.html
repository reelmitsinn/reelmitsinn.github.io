<style>
:root{--bg:#f6efe7;--ink:#2f2019;--ink2:#6b5546;--choc:#493126;--sand:#b18b6f;--rose:#c99b7a;--pill:#ece2d6;--line:rgba(73,49,38,.12);
--glass:rgba(255,252,248,.7);--ease:cubic-bezier(.22,1,.36,1);--display:"Bebas Neue",Oswald,"Arial Narrow",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 Montserrat,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 20s ease-in-out infinite alternate}
.b1{width:520px;height:520px;background:#c99b7a;left:-160px;top:-120px}.b2{width:480px;height:480px;background:#efdcc8;right:-140px;top:30%;animation-duration:26s}.b3{width:420px;height:420px;background:#b18b6f;left:30%;bottom:-260px;animation-duration:30s}
@keyframes fl{to{transform:translate3d(50px,-40px,0) scale(1.12)}}
header{max-width:980px;margin:0 auto;padding:22px 20px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:26px;letter-spacing:.05em;color:var(--choc);display:flex;align-items:center;gap:10px}
.logo svg{width:28px;height:28px}
.save{margin-left:auto;font-size:12px;color:var(--ink2)}
main{max-width:980px;margin:0 auto;padding:18px 20px 80px}
/* прогресс по фазам */
.progress{display:flex;gap:6px;margin:14px 0 6px;flex-wrap:wrap}
.ph{flex:1 1 0;min-width:52px;display:flex;flex-direction:column;gap:5px}
.phl{border:0;background:none;cursor:pointer;text-align:left;font-size:11px;color:var(--ink2);display:flex;gap:5px;align-items:baseline;white-space:nowrap;overflow:hidden;padding:0}
.phl b{font-family:var(--display);font-size:17px;color:var(--sand);font-weight:400}
.ph.done .phl b{color:var(--rose)}.ph.cur .phl b{color:var(--choc)}.ph.cur .phl{color:var(--choc);font-weight:600}
.phl span{overflow:hidden;text-overflow:ellipsis}
.pdots{display:flex;gap:3px}
.dot{display:block;height:8px;flex:1;min-width:6px;border-radius:99px;background:rgba(73,49,38,.1);cursor:pointer;transition:background .4s}
.dot.done{background:var(--sand)}.dot.cur{background:var(--choc)}
.plabel{font-size:12px;color:var(--ink2)}
.card{margin-top:18px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:30px 30px 26px;box-shadow:0 30px 60px -40px rgba(73,49,38,.45);animation:in .7s var(--ease)}
.card.still{animation:none}
@keyframes in{from{opacity:0;transform:translateY(18px);filter:blur(6px)}}
.step-n{font-family:var(--display);font-size:20px;color:var(--rose);letter-spacing:.06em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,72px);line-height:.95;color:var(--choc)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.5vw,52px);line-height:1;color:var(--choc);margin-top:2px}
.intro{color:var(--ink2);margin-top:8px;max-width:680px}
.tip{margin-top:16px;background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:13.5px;color:var(--ink2);white-space:pre-line;max-width:760px}
.q{margin-top:22px}
.q>label,.q>.lab{display:block;font-weight:600;color:var(--choc);margin-bottom:6px}
.q small{display:block;color:var(--ink2);font-size:12.5px;margin:-2px 0 8px;white-space:pre-line}
.ex{margin:-4px 0 8px;font-size:12.5px}
.ex summary{cursor:pointer;color:var(--sand);display:inline-block;list-style:none;text-decoration:underline dotted}
.ex summary::-webkit-details-marker{display:none}
.ex div{margin-top:6px;background:#fffaf5;border:1px dashed var(--rose);border-radius:12px;padding:8px 12px;color:var(--ink2);white-space:pre-line}
.field{display:flex;gap:8px;align-items:flex-start}
.field textarea,.field input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;outline:0;transition:border .3s,box-shadow .3s}
.field textarea{min-height:84px;resize:vertical}
.field textarea:focus,.field input:focus,.cell input:focus,.cell textarea:focus,.cell select:focus{border-color:var(--sand);box-shadow:0 0 0 4px rgba(201,155,122,.18);outline:0}
.mic{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--pill);cursor:pointer;font-size:18px}
.mic.rec{background:var(--rose);color:#fff;animation:pu 1.2s infinite}@keyframes pu{50%{box-shadow:0 0 0 8px rgba(201,155,122,.25)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:400;color:var(--ink);cursor:pointer;font-size:13.5px;margin:0}
.chips input{accent-color:var(--choc)}
.nav{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--pill);font-size:14px;transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.dark{background:var(--choc);color:#f6efe7;box-shadow:0 12px 26px -14px rgba(73,49,38,.7)}
.note{margin-top:20px;background:#fff;border-left:4px solid var(--rose);border-radius:14px;padding:12px 16px;font-size:13.5px;color:var(--ink2);white-space:pre-line}
.note b{color:var(--choc)}
.note ul{margin:6px 0 0 18px;white-space:normal}
.acc{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.acc .head{display:flex;gap:8px;flex-wrap:wrap}
.acc .head input{flex:1 1 200px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.vid{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.vid input,.vid textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.vid textarea{min-height:60px}
.small{padding:6px 12px;font-size:12.5px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:20px}
.map>div{background:#fff;border-radius:16px;padding:12px 14px;font-size:13px;border:1px solid var(--line)}
.map b{display:block;font-family:Oswald;font-weight:500;color:var(--choc);font-size:15px}
.map.info{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.map ul{margin:6px 0 0 18px}
/* копируемый блок */
.copywrap textarea{width:100%;min-height:220px;font-size:13px;line-height:1.5;border:1px dashed var(--sand);background:#fffaf5;border-radius:16px;padding:12px 14px;resize:vertical}
.copywrap .nav{margin-top:8px}
/* ползунок */
.sl{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.sl input{flex:1;accent-color:var(--choc);min-width:0}
.sl output{font-family:var(--display);font-size:24px;color:var(--choc);min-width:34px;text-align:right}
.sl output.no{font-family:Montserrat;font-size:11px;color:var(--ink2);min-width:70px}
/* таблица-карточки */
.tbl{display:flex;flex-direction:column;gap:12px;margin-bottom:10px}
.trow{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.thead b{font-family:Oswald;font-weight:500;color:var(--choc);font-size:16px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cell{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.cell.full{grid-column:1/-1}
.cell input,.cell textarea,.cell select{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fffdfb;color:var(--ink);font-size:14px;width:100%}
.cell textarea{min-height:64px;resize:vertical}
.cnt{font-size:12px;color:var(--ink2);margin-left:10px}
/* скриншоты */
.shots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1.5px dashed var(--line);border-radius:14px;padding:8px;margin-top:8px;background:rgba(255,255,255,.6);transition:border .3s}
.shots.over{border-color:var(--sand)}
.shots .th{position:relative;display:inline-block}
.shots img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.shots .th button{position:absolute;top:2px;right:2px;padding:0 7px;background:#fff}
.shint{font-size:11.5px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--choc);color:#f6efe7;padding:10px 18px;border-radius:999px;font-size:13px;transition:.4s;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.card{padding:22px 16px}main,header{padding-left:16px;padding-right:16px}
 .ph{min-width:24px}.phl span{display:none}.ph.cur{min-width:110px}.ph.cur .phl span{display:inline}
 input,textarea,select{font-size:16px!important}.tgrid{grid-template-columns:1fr}.btn{padding:11px 18px}.save{margin-left:0;width:100%}}
</style>

<script>
/* Клиентская версия v0.3: только вопросы, шаблоны и шаги клиента. Анализ и тексты делает Проводник по этим ответам.
   Типы полей: text (по умолчанию), line, chips, radio, colors, images, shots, slider, table, copy, days, weak. */
const PHASES={A:'Фундамент',B:'Помощники',C:'Аудитория',D:'Конкуренты',E:'Распаковка и смыслы',F:'Контент-стратегия',G:'Скиллы',H:'Производство',I:'Автоматизация',J:'Ритм и разбор'};
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

/* ---------- шаблоны для копирования ---------- */
const T_SURVEY=`1. Имя / ник в Telegram / телефон
2. Возраст, пол
3. [вопросы на сегмент для твоей ниши]
4. Назовите 3 главные проблемы, которые привели вас ко мне
5. Как вы уже пытались решить эту проблему?
6. Назовите 3 темы, которые мне стоит раскрыть глубже
7. Чего вы опасаетесь при покупке продукта или услуги в теме [твоя тема]?
8. Какие ошибки вы чаще всего допускаете в теме [твоя тема]?
9. Какие цели ставите на год? Или: если бы у вас была волшебная палочка, что бы вы загадали?
10. Готовы ли вы 20 минут поговорить со мной на созвоне?`;
const T_SURVEY_INVITE=`Мне нужна ваша помощь! У меня много опыта и знаний, которые могут помочь вам в [ключевое решение]. Чтобы мой контент был полезнее и интереснее для вас, прошу заполнить небольшую анкету. Для меня это очень ценно. Вы очень поможете, если ответите развёрнуто.

Анкета займёт около 5 минут.
Из всех анкет я выберу несколько человек для личного интервью. За это интервью подарю [подарок].`;
const T_CD_INVITE=`Привет! Это [имя], [кто ты и чем занимаешься]. Хочу пригласить тебя на короткое интервью: 30–40 минут один на один в Zoom. Мне важно понять, [что именно хочешь понять]. Ничего не продаю, только спрашиваю.`;
const T_CD_STORY=`Ищу 10 человек, кто со мной в Zoom.
[О чём поговорим] · [что подарю за разговор]`;
const T_CD_CONTENT=`НАЧАЛО
Поблагодари за время и скажи, чем человек тебе поможет. Представься: ты улучшаешь контент и продукты, правильных и неправильных ответов нет, разговор конфиденциальный. Спроси, удобнее на «ты» или на «вы», и можно ли записывать.

О ЧЕЛОВЕКЕ
— Как вас зовут? Сколько лет? Из какого города?
— Чем сейчас занимаетесь? Если не работаете — кем работали раньше?

БОЛИ И ЖЕЛАНИЯ
— Почему вам интересна тема [ниша]?
— Каким видите свой идеальный результат в этой теме?
— Что мешает сейчас двигаться к этому результату?
— С какими проблемами в этой теме сталкиваетесь чаще всего? Назовите минимум 3.

КОНТЕНТ
— Как давно подписаны на меня? Что нравится в моём контенте?
— Какой контент вы не пролистываете?
— За кем следите каждый день? Назовите минимум 5 страниц.
— Почему вы на них подписались? Чем нравятся эти блоги?
— Что бесит на страницах блогеров? Почему отписываетесь?
— Что чаще всего сохраняете в теме [ниша]?

ЗАВЕРШЕНИЕ
— Есть ли что-то важное, о чём мы не поговорили?
Ещё раз поблагодари и скажи, что пришлёшь обещанный подарок.

По ходу записывай заметки: всё важное, чего нет в списке.`;
const T_CD_PRODUCT=`НАЧАЛО — как в контентном интервью.

О ЧЕЛОВЕКЕ
— Расскажите о себе в 2–3 предложениях: возраст, откуда вы, есть ли семья.
— Чем занимаетесь? Какие интересы и хобби?
— Сколько зарабатываете за последние 3 месяца?

БОЛИ, ЖЕЛАНИЯ, ЗАДАЧИ
— О чём мечтаете? Чего хотели бы достичь? (Возьми главное желание и 5 раз подряд спроси «Зачем?» — так доходят до настоящего мотива.)
— Какие проблемы и задачи стояли перед вами в [ниша] за последние 3 месяца?
— Что будет, если проблему не решать? Опишите самый плохой сценарий.
— Каким видите свой идеальный результат в [ниша]?
— Что мешает спать спокойно? Что больше всего беспокоит?
— Что раздражает больше всего в [ниша]?
— Какие ошибки вы чаще всего допускаете в [ниша]?
— Как думаете, почему вы ещё не в точке Б?

ОПЫТ
— Как вы пытались решить эту проблему? Расскажите по порядку.
— Что сработало, а что нет? Почему?
— Между какими решениями выбирали? Почему выбрали это?
— Сколько обычно тратите на обучение или решение таких задач?
— Где и как ищете информацию о решениях?

ЦЕННОСТИ И ВЫБОР
— Что облегчило бы вам жизнь или работу?
— Какие качества эксперта, бренда и продукта для вас важны?
— Чего вы больше всего опасаетесь при покупке такого продукта?
— Какие риски для вас важны: деньги, мнение других, техника?
— Что было решающим в ваших прошлых покупках?

ВОЗРАЖЕНИЯ
— Предложи продукт: [продукт] за [сумма], решает [проблема человека]; учтено то, что его беспокоит; формат — [формат]. Спроси: «Есть ли причины, по которым вы бы его НЕ купили?»
— На «дорого», «я подумаю»: «Что конкретно должно измениться, чтобы вы купили? Дорого по сравнению с чем?»
— На «нет денег сейчас»: «Если будет рассрочка — вопрос снимается? Что тогда остаётся?»
— Кому бы вы посоветовали этот продукт и почему?

ТЕМ, КТО УЖЕ ПОКУПАЛ ПОХОЖЕЕ
— Откуда узнали о продукте? Что заставило задуматься об обучении?
— Каких знаний не хватало? Что решило покупку?
— Где искали решения? Что привлекало, что отталкивало?
— Какая боль закрылась? Какая новая появилась?
— Сколько готовы заплатить за решение?

ЗАВЕРШЕНИЕ — поблагодари и пришли обещанный подарок.`;
const T_EXPORT=`TELEGRAM
1. Открой Telegram Desktop на компьютере.
2. Зайди в свой канал → меню ⋮ → «Экспорт истории чата».
3. Формат — Machine-readable JSON (не HTML: JSON нейросеть читает лучше).
4. Период — можно за всё время или за несколько месяцев.
5. Сохрани файл result.json и отправь его программе.
Своего канала нет — можно выгрузить канал автора, чей стиль нравится. Стиль можно взять чужой, содержание — только своё.

INSTAGRAM
Центр аккаунтов → «Скачать информацию» → формат JSON → публикации и Reels. В выгрузке есть все подписи.
(Названия пунктов в твоём приложении могут немного отличаться.)`;
const T_DAY5=`Сторис на день по одной сюжетной линии — 5 вопросов:
1. Что происходит?
2. Почему?
3. Как я к этому отношусь?
4. Почему это для меня важно?
5. Что будет дальше?`;

/* ---------- примеры ответов (только из курса или «пример-образец») ---------- */
const EX={
 niche:'Пример из курса (практикум 2): нутрициолог Аня, 31 год, блог около 4 тысяч. Сама после родов сбросила 18 кг — вокруг неё собрались мамы после родов.',
 who:'Пример из курса (Аня): мамы после родов, которые кормят грудью и хотят вернуть форму.',

 d_client:'Пример из курса (Аня):\nболь — «срываюсь вечером, ненавижу себя»;\nстрах — «вдруг диета навредит малышу»;\nвозражение — нет времени учиться и готовить себе отдельно.',
 d_phrases:'Пример из курса: «ем после ребёнка остатки каши и ненавижу себя вечером».',
 u4:'Пример из курса — «копаем до дна»: «питаться правильно» → «сбросить 7 кг» → «летом свадьба сестры» → «не хочу опять прятаться за спинами на фото».',
 u8:'Пример из курса (отстройка Ани): питание для мам на ГВ с личным сопровождением и без подсчёта калорий.',

 {id:'unpack1',p:'E',title:'Распаковка · ты и твои люди',note:'По курсу распаковка идёт после аудитории и конкурентов. 30–40 минут, вопросы по одному, лучше голосом. Главный приём — «И что?»: свойство → выгода → ценность → глубинная ценность.',intro:'Отвечай развёрнуто и честно — как думаешь, даже если получается криво или уязвимо. Чем меньше фильтров, тем точнее результат. Не знаешь — напиши первое, что приходит в голову, или чего ты точно НЕ хочешь.',qs:[

   ['u20','Нарисуй словами своего типичного клиента','Не возраст и город, а внутреннее состояние: что он говорит себе, чего избегает, во что верит, чего боится.'],

 {id:'info1',p:'E',title:'Позиционирование и карта смыслов',info:{does:'По распаковке, аудитории и конкурентам программа собирает 3–5 вариантов позиционирования по формуле «Я помогаю [кому] решить [проблему] через [способ]», проверяет каждый тестом «замени имя на конкурента» и 9 способами отстройки. Потом — карта смыслов, главный документ всей программы.',
   out:['выводы распаковки: 5–10 черт уникальности, ключевое слово, миссия, главная тема, 3 темы блога, первый черновик шапки, 2 якоря','позиционирование + 2–3 вариации + шапка профиля до 150 знаков и 3 темы для закрепов','карта смыслов: по каждому сегменту боль → смысл → оффер → форматы и заголовки; что докрутить'],

 {id:'bio',p:'E',title:'Шапка профиля',note:'Что говорит курс о шапке и хайлайтах:\n• Шапка — до 150 знаков. Её пишет программа из позиционирования, вместе с 3 темами для закрепов (практикум 2).\n• Первый черновик шапки и «два якоря» даёт распаковка (практикум 2).\n• В шапке должна быть ссылка, а хотя бы один закреп или хайлайт — про продукт. Человек должен понять, что можно купить и что сделать прямо сейчас (Женя Старилова, самооценка блога).\n• В продающем ролике действие называют словами: «переходи по ссылке в шапке» (Старилова).\n• Хайлайты — как мини-лендинги: кто я, продукты, кейсы, отзывы, как со мной работать (контент-стратегия Дымшакова, урок 10).\n• Цели и сюжетные линии можно вынести в хайлайтс (практикум 3, бриф героя).\nПро аватар и имя профиля отдельных правил в курсе нет.',qs:[
   ['b_shot','Скриншот профиля сейчас','Главная страница целиком: аватар, имя, шапка, хайлайты.','shots'],
   ['b_name','Имя и ник сейчас','','line'],
   ['b_bio','Текст шапки сейчас','Скопируй как есть.'],
   ['b_avatar','Аватар','Скриншот или фото, которое стоит на аватаре.','shots'],
   ['b_hl','Какие хайлайты есть сейчас?','Названия кружков по порядку.'],
   ['b_hlShot','Скриншот хайлайтов','','shots'],
   ['b_link','Ссылка в шапке — куда ведёт?','Бот, сайт, анкета, Telegram — или ссылки нет.','line'],
   ['b_pins','Закреплённые посты или рилс — о чём они?','']],
   info:{does:'По позиционированию и распаковке программа пишет новую шапку.',out:['шапка до 150 знаков, 2–3 варианта','3 темы для закрепов','какие хайлайты нужны: продукт, кейсы, отзывы, кто я, как со мной работать'],uses:['позиционирование','выводы распаковки','твою шапку и хайлайты сейчас']}},

const KEY='otsmysla_answers_v1',MAXPICS=30;
let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
A.likes=A.likes||[];
let cur=Math.max(0,STEPS.findIndex(s=>s.id===A._sid));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)};
function save(){A._sid=STEPS[cur].id;try{localStorage.setItem(KEY,JSON.stringify(A));$('#save').textContent='сохранено ✓';return true}catch(e){$('#save').textContent='не сохранилось — скачай ответы';return false}}
const filled=r=>Object.entries(r||{}).some(([k,x])=>k!=='shots'&&String(x??'').trim());

/* ---------- прогресс по фазам ---------- */
function prog(){const ps=[...new Set(STEPS.map(s=>s.p))],cp=STEPS[cur].p;
  $('#prog').innerHTML=ps.map(p=>{const idx=STEPS.map((s,i)=>s.p===p?i:-1).filter(i=>i>=0);const st=idx[idx.length-1]<cur?'done':(p===cp?'cur':'');
    return `<div class="ph ${st}" style="flex-grow:${idx.length}"><button class="phl" data-go="${idx[0]}" title="${esc(PHASES[p])}"><b>${p}</b><span>${esc(PHASES[p])}</span></button><div class="pdots">${idx.map(i=>`<i class="dot ${i<cur?'done':''} ${i===cur?'cur':''}" data-go="${i}" title="${esc(STEPS[i].title)}"></i>`).join('')}</div></div>`}).join('');
  $('#plabel').textContent=`Фаза ${cp} · ${PHASES[cp]} — шаг ${cur+1} из ${STEPS.length}: ${STEPS[cur].title}`;
  document.querySelectorAll('[data-go]').forEach(d=>d.onclick=()=>{cur=+d.dataset.go;save();render();scrollTo({top:0})})}

/* ---------- поля ---------- */
function exHTML(k){return EX[k]?`<details class="ex"><summary>показать пример</summary><div>${esc(EX[k])}</div></details>`:''}
function qHTML([k,l,sm,type,opts]){
  if(type==='weak')return '<div class="note" id="weak"></div>';
  const head=`<div class="q"><${type&&type!=='line'?'div class="lab"':'label for="f_'+k+'"'}>${esc(l)}</${type&&type!=='line'?'div':'label'}>${sm?`<small>${esc(sm)}</small>`:''}${exHTML(k)}`;
  if(type==='chips'||type==='days'){const v=A[k]||[],o=type==='days'?DAYS:opts;return head+`<div class="chips">${o.map(x=>`<label><input type="checkbox" data-chip="${k}" value="${esc(x)}" ${v.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div></div>`}
  if(type==='radio')return head+`<div class="chips">${opts.map(o=>`<label><input type="radio" name="r_${k}" data-radio="${k}" value="${esc(o)}" ${A[k]===o?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`;
  if(type==='colors'){const v=A[k]||['#493126','#c99b7a','#f6efe7'];return head+`<div class="chips" id="cols">${v.map((c,i)=>`<label style="padding:4px 8px"><input type="color" data-col="${i}" value="${esc(c)}" style="width:34px;height:28px;border:0;background:none;padding:0;cursor:pointer"><span style="font-family:monospace;font-size:12px">${esc(c)}</span><button class="btn small" data-colx="${i}" style="padding:0 8px;background:transparent">×</button></label>`).join('')}${v.length<6?'<button class="btn small" id="colAdd">+ цвет</button>':''}</div></div>`}
  if(type==='images'){const v=A[k]||[];return head+`<div class="drop" id="drop" style="border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--ink2);background:#fff">Перетащи картинки сюда или <button class="btn small" id="pick">выбери файлы</button><input type="file" id="files" accept="image/*" multiple hidden></div>
      <div class="chips" style="margin-top:10px">${v.map((im,i)=>`<span style="position:relative;display:inline-block"><img src="${im}" alt="" style="width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line)"><button class="btn small" data-imx="${i}" style="position:absolute;top:4px;right:4px;padding:0 8px;background:#fff">×</button></span>`).join('')}</div></div>`}
  if(type==='shots')return head+shotsHTML('f:'+k)+'</div>';
  if(type==='slider'){const v=A[k],has=typeof v==='number';return head+`<div class="sl"><span class="shint">0</span><input type="range" min="0" max="5" step="1" data-sl="${k}" value="${has?v:0}" aria-label="${esc(l)}"><span class="shint">5</span><output class="${has?'':'no'}">${has?v:'не оценено'}</output></div></div>`}
  if(type==='table')return head+tableHTML(k,opts)+'</div>';
  if(type==='copy'){const v=A[k]!=null?A[k]:opts;return head+`<div class="copywrap"><textarea data-copyk="${k}" aria-label="${esc(l)}">${esc(v)}</textarea><div class="nav"><button class="btn small dark" data-copy="${k}">Скопировать</button>${A[k]!=null?`<button class="btn small" data-reset="${k}">вернуть шаблон</button>`:''}</div></div></div>`}
  if(type==='line')return head+`<div class="field"><input id="f_${k}" data-k="${k}" value="${esc(A[k]||'')}"></div></div>`;
  return head+`<div class="field"><textarea id="f_${k}" data-k="${k}">${esc(A[k]||'')}</textarea><button class="mic" data-mic="f_${k}" title="Надиктовать">🎤</button></div></div>`}
function tableHTML(k,c){if(!Array.isArray(A[k]))A[k]=[];const rows=A[k];while(rows.length<(c.min||0))rows.push({});
  return `<div class="tbl">${rows.map((r,i)=>`<div class="trow"><div class="thead"><b>${esc(c.item)} ${i+1}</b><button class="btn small" data-tdel="${k}" data-ti="${i}">удалить</button></div><div class="tgrid">${c.cols.map(col=>cellHTML(k,i,col,r[col.f])).join('')}${c.shots?`<div class="cell full"><span>Скриншоты</span>${shotsHTML(`t:${k}:${i}`)}</div>`:''}</div></div>`).join('')}</div>
   <button class="btn small" data-tadd="${k}" ${rows.length>=c.max?'disabled':''}>${rows.length>=c.max?'максимум '+c.max:esc(c.add)}</button><span class="cnt">от ${c.min||0} до ${c.max}</span>`}
function cellHTML(k,i,col,v){const a=`data-tk="${k}" data-ti="${i}" data-tf="${col.f}"`;let inner;
  if(col.t==='select')inner=`<select ${a}><option value="">—</option>${col.o.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(col.t==='area')inner=`<textarea ${a} placeholder="${esc(col.ph||'')}">${esc(v||'')}</textarea>`;
  else inner=`<input ${a} placeholder="${esc(col.ph||'')}" value="${esc(v||'')}">`;
  return `<label class="cell"><span>${esc(col.l)}</span>${inner}</label>`}

/* ---------- экран ---------- */
const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
function render(still){const s=STEPS[cur];prog();
  let h=`<div class="card${still?' still':''}"><div class="step-n">ШАГ ${String(cur+1).padStart(2,'0')} · ${s.p} · ${esc(PHASES[s.p]).toUpperCase()}</div>`;
  h+=cur===0?`<h1>От смысла к контенту</h1>`:`<h2>${esc(s.title)}</h2>`;
  if(s.intro)h+=`<p class="intro">${esc(s.intro)}</p>`;
  if(s.note)h+=`<div class="tip">${esc(s.note)}</div>`;
  if(s.qs)h+=s.qs.map(qHTML).join('');
  if(s.likes)h+=`<div id="likes"></div><div class="nav" style="margin-top:12px"><button class="btn small" id="addAcc">+ аккаунт</button></div>`;
  if(s.info){const f=s.info;h+=`<div class="note"><b>Этот шаг делает программа.</b> ${esc(f.does)}</div><div class="map info">${f.out?`<div><b>Что получится</b><ul>${li(f.out)}</ul></div>`:''}${f.uses?`<div><b>Что берёт из твоих ответов</b><ul>${li(f.uses)}</ul></div>`:''}${f.you?`<div><b>Твоё участие</b>${esc(f.you)}</div>`:''}</div>`}
  if(s.finish){const n=needList(),pics=allPics().length;
   h+=`<p class="intro">Спасибо! Твои ответы собраны. Дальше программа делает анализ и готовит результаты:</p><div class="map">
   <div><b>Аудитория и конкуренты</b>сегменты, боли, разбор конкурентов</div><div><b>Позиционирование</b>3–5 вариантов и шапка профиля</div><div><b>Карта смыслов</b>боль → смысл → оффер → контент</div>
   <div><b>Мой стиль</b>приёмы из любимых аккаунтов</div><div><b>Контент-стратегия</b>цели, бриф героя, сюжетные линии, ритм</div><div><b>Скиллы</b>помощники под твои форматы</div>
   <div><b>Контент-план</b>4 недели под твой объём</div><div><b>Сценарии и посты</b>рилс, посты, прогрев, продающее видео</div><div><b>Разбор</b>что оставить, что усилить</div></div>
   <div class="note"><b>${n.length?'Чего пока не хватает:':'Всё основное есть.'}</b>${n.length?`<ul>${li(n)}</ul>`:''}</div>
   <div class="note"><b>Как отправить:</b> нажми «Отправить ✈» — ответы и картинки сразу придут автору программы. Запасной путь: «Скопировать ответы» или «Скачать файл».${pics?` Картинки и скриншоты (${pics}) скачай отдельно и приложи.`:''}</div>
   <div class="nav"><button class="btn dark" id="sendTg">Отправить ✈</button><button class="btn" id="copyAll">Скопировать ответы</button><button class="btn" id="dl">Скачать файл</button>${pics?'<button class="btn" id="dlImg">Скачать картинки</button>':''}</div>`}
  h+=`<div class="nav">${cur>0?'<button class="btn" id="back">← Назад</button>':''}${!s.finish?'<button class="btn dark" id="next">Дальше →</button>':''}</div></div>`;
  $('#view').innerHTML=h;bind(s);save()}
function bind(s){const all=q=>document.querySelectorAll(q);
  all('[data-k]').forEach(t=>t.oninput=()=>{A[t.dataset.k]=t.value;save()});
  all('[data-chip]').forEach(c=>c.onchange=()=>{const k=c.dataset.chip;A[k]=[...all(`[data-chip="${k}"]:checked`)].map(x=>x.value);save()});
  all('[data-radio]').forEach(c=>c.onchange=()=>{A[c.dataset.radio]=c.value;save()});
  all('[data-sl]').forEach(r=>{r.oninput=r.onchange=r.onpointerup=r.onkeyup=()=>{A[r.dataset.sl]=+r.value;const o=r.parentNode.querySelector('output');o.textContent=r.value;o.className='';save();weak()}});
  all('[data-copyk]').forEach(t=>t.oninput=()=>{A[t.dataset.copyk]=t.value;save()});
  all('[data-copy]').forEach(b=>b.onclick=()=>copyText(document.querySelector(`[data-copyk="${b.dataset.copy}"]`).value));
  all('[data-reset]').forEach(b=>b.onclick=()=>{delete A[b.dataset.reset];save();render(true)});
  all('[data-tk]').forEach(el=>{el[el.tagName==='SELECT'?'onchange':'oninput']=()=>{A[el.dataset.tk][+el.dataset.ti][el.dataset.tf]=el.value;save()}});
  all('[data-tadd]').forEach(b=>b.onclick=()=>{A[b.dataset.tadd].push({});save();render(true)});
  all('[data-tdel]').forEach(b=>b.onclick=()=>{const r=A[b.dataset.tdel][+b.dataset.ti];if(filled(r)&&!confirm('Удалить эту карточку?'))return;A[b.dataset.tdel].splice(+b.dataset.ti,1);save();render(true)});
  if($('#cols')){A.colors=A.colors||['#493126','#c99b7a','#f6efe7'];
    all('[data-col]').forEach(c=>c.oninput=()=>{A.colors[+c.dataset.col]=c.value;c.nextElementSibling.textContent=c.value;save()});
    all('[data-colx]').forEach(b=>b.onclick=e=>{e.preventDefault();A.colors.splice(+b.dataset.colx,1);save();render(true)});
    $('#colAdd')&&($('#colAdd').onclick=()=>{A.colors.push('#b18b6f');save();render(true)})}
  if($('#drop')){$('#pick').onclick=()=>$('#files').click();$('#files').onchange=()=>addImages([...$('#files').files]);
    ['dragenter','dragover'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').style.borderColor='#b18b6f'}));
    $('#drop').addEventListener('drop',e=>{e.preventDefault();addImages([...e.dataTransfer.files])});
    $('#drop').onmouseenter=()=>activeShot=null;
    all('[data-imx]').forEach(b=>b.onclick=()=>{A.images.splice(+b.dataset.imx,1);save();render(true)})}
  all('[data-mic]').forEach(b=>b.onclick=()=>dictate(b));
  bindShots(document.getElementById('view'));
  if(s.likes)renderLikes();
  weak();
  $('#next')&&($('#next').onclick=()=>{cur++;save();render();scrollTo({top:0,behavior:'smooth'})});
  $('#back')&&($('#back').onclick=()=>{cur--;save();render();scrollTo({top:0})});
  $('#copyAll')&&($('#copyAll').onclick=()=>copyText(exportText()));
  $('#dlImg')&&($('#dlImg').onclick=async()=>{for(const p of allPics()){const a=document.createElement('a');a.href=p.d;a.download=p.n;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,400))}});
  $('#dl')&&($('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([exportText()],{type:'text/plain;charset=utf-8'}));a.download='otvety_ot_smysla_k_kontentu.txt';a.click()})}
function weak(){const box=$('#weak');if(!box)return;const sl=STEPS[cur].qs.filter(q=>q[3]==='slider').map(q=>({l:q[1],v:A[q[0]]})).filter(x=>typeof x.v==='number');
  if(!sl.length){box.textContent='Подвигай ползунки — здесь появятся твои слабые места.';return}
  sl.sort((a,b)=>a.v-b.v);let w=sl.filter(x=>x.v<=2);if(!w.length)w=sl.filter(x=>x.v===sl[0].v);
  box.textContent='Слабее всего: '+w.slice(0,3).map(x=>`${x.l} (${x.v})`).join(', ')+'. Из них выбери одну цель на 2 недели ниже.'}
function copyText(t){const ok=()=>toast('Скопировано');const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')?ok():toast('Не получилось — выдели текст вручную')}catch(e){toast('Не получилось — выдели текст вручную')}ta.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb()}

/* ---------- «Мне нравится» ---------- */
const WHAT=['хук','подача','монтаж и темп','визуал и свет','тема','текст на экране','музыка','формат','сторителлинг','призыв'];
function renderLikes(){const box=$('#likes');box.innerHTML=A.likes.map((a,i)=>`<div class="acc"><div class="head"><input data-a="${i}" data-f="name" placeholder="Аккаунт (@ник)" value="${esc(a.name)}"><input data-a="${i}" data-f="url" placeholder="Ссылка на аккаунт" value="${esc(a.url)}"><button class="btn small" data-del="${i}">удалить</button></div>
   ${shotsHTML(`l:${i}`)}
   ${(a.items||[]).map((v,j)=>`<div class="vid"><input data-a="${i}" data-v="${j}" data-f="url" placeholder="Ссылка на ролик / пост" value="${esc(v.url)}"><div class="chips" style="margin-top:8px">${WHAT.map(w=>`<label><input type="checkbox" data-a="${i}" data-v="${j}" data-w="${w}" ${(v.what||[]).includes(w)?'checked':''}>${w}</label>`).join('')}</div><textarea data-a="${i}" data-v="${j}" data-f="note" placeholder="Что именно нравится и что хочу так же">${esc(v.note)}</textarea>${shotsHTML(`l:${i}:${j}`)}</div>`).join('')}
   <button class="btn small" data-addv="${i}" style="margin-top:10px">+ ролик</button></div>`).join('')||'<p class="intro">Пока пусто — добавь первый аккаунт.</p>';
  $('#addAcc').disabled=A.likes.length>=5;$('#addAcc').textContent=A.likes.length>=5?'максимум 5':'+ аккаунт';
  box.querySelectorAll('input[data-f],textarea[data-f]').forEach(el=>el.oninput=()=>{const a=A.likes[el.dataset.a];if(el.dataset.v!==undefined)a.items[el.dataset.v][el.dataset.f]=el.value;else a[el.dataset.f]=el.value;save()});
  box.querySelectorAll('input[data-w]').forEach(c=>c.onchange=()=>{const v=A.likes[c.dataset.a].items[c.dataset.v];v.what=v.what||[];if(c.checked)v.what.push(c.dataset.w);else v.what=v.what.filter(x=>x!==c.dataset.w);save()});
  box.querySelectorAll('[data-addv]').forEach(b=>b.onclick=()=>{const a=A.likes[b.dataset.addv];a.items=a.items||[];if(a.items.length>=3){toast('До 3 роликов на аккаунт');return}a.items.push({url:'',what:[],note:''});save();renderLikes()});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{A.likes.splice(+b.dataset.del,1);save();renderLikes()});
  $('#addAcc').onclick=()=>{if(A.likes.length>=5)return;A.likes.push({name:'',url:'',items:[{url:'',what:[],note:''}]});save();renderLikes()};
  bindShots(box)}

/* ---------- картинки и скриншоты ---------- */
function shrink(file,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q||.75))};img.onerror=()=>res(null);img.src=r.result};r.readAsDataURL(file)})}
function shotArr(path,create){const p=path.split(':');let o;
  if(p[0]==='f'){A.shots=A.shots||{};if(create&&!A.shots[p[1]])A.shots[p[1]]=[];return A.shots[p[1]]||[]}
  if(p[0]==='t')o=(A[p[1]]||[])[+p[2]];
  else if(p[0]==='l'){o=A.likes[+p[1]];if(o&&p[2]!=null)o=(o.items||[])[+p[2]]}
  if(!o)return [];if(create&&!o.shots)o.shots=[];return o.shots||[]}
function allPics(){const out=[];(A.images||[]).forEach((d,i)=>out.push({n:`style_images_${i+1}.jpg`,d}));
  Object.entries(A.shots||{}).forEach(([k,arr])=>{const st=STEPS.find(s=>(s.qs||[]).some(q=>q[0]===k));(arr||[]).forEach((d,i)=>out.push({n:`${st?st.id:'step'}_${k}_${i+1}.jpg`,d}))});
  (A.likes||[]).forEach((a,i)=>{(a.shots||[]).forEach((d,n)=>out.push({n:`likes_akk${i+1}_${n+1}.jpg`,d}));(a.items||[]).forEach((v,j)=>(v.shots||[]).forEach((d,n)=>out.push({n:`likes_akk${i+1}_rolik${j+1}_${n+1}.jpg`,d})))});
  STEPS.forEach(s=>(s.qs||[]).forEach(q=>{if(q[3]==='table')(A[q[0]]||[]).forEach((r,i)=>(r.shots||[]).forEach((d,n)=>out.push({n:`${s.id}_${q[0]}${i+1}_${n+1}.jpg`,d})))}));
  return out}
function shotsHTML(path){const arr=shotArr(path);return `<div class="shots" data-shot="${path}">${arr.map((d,i)=>`<span class="th"><img src="${d}" alt=""><button class="btn small" data-shx="${path}" data-si="${i}" title="Удалить">×</button></span>`).join('')}<button class="btn small" data-shadd="${path}">+ Скриншот</button><span class="shint">или перетащи сюда / Ctrl+V</span></div>`}
let activeShot=null,pickFor=null;
const picker=document.createElement('input');picker.type='file';picker.accept='image/*';picker.multiple=true;picker.hidden=true;document.body.appendChild(picker);
picker.onchange=()=>{if(pickFor)addShots(pickFor,[...picker.files]);picker.value=''};
function rerenderFor(path){if(path.startsWith('l:')&&$('#likes'))renderLikes();else render(true)}
async function addShots(path,files){files=files.filter(f=>f.type&&f.type.startsWith('image/'));if(!files.length)return;
  for(const f of files){if(allPics().length>=MAXPICS){toast(`Максимум ${MAXPICS} картинок и скриншотов`);break}const d=await shrink(f,.75);if(!d)continue;const arr=shotArr(path,true);arr.push(d);
    if(!save()){arr.pop();save();toast('Не хватает места в браузере — удали пару картинок');break}}
  rerenderFor(path)}
async function addImages(files){A.images=A.images||[];for(const f of files){if(!f.type.startsWith('image/'))continue;if(A.images.length>=10){toast('Максимум 10 картинок');break}if(allPics().length>=MAXPICS){toast(`Максимум ${MAXPICS} картинок и скриншотов`);break}
    const d=await shrink(f,.75);if(!d)continue;A.images.push(d);if(!save()){A.images.pop();save();toast('Не хватает места в браузере — удали пару картинок');break}}
  render(true)}
function bindShots(root){root.querySelectorAll('[data-shadd]').forEach(b=>b.onclick=e=>{e.preventDefault();pickFor=activeShot=b.dataset.shadd;picker.click()});
  root.querySelectorAll('[data-shx]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();shotArr(b.dataset.shx).splice(+b.dataset.si,1);save();rerenderFor(b.dataset.shx)});
  root.querySelectorAll('[data-shot]').forEach(z=>{z.onmouseenter=z.onclick=()=>{activeShot=z.dataset.shot};
    z.ondragover=z.ondragenter=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=e=>{e.preventDefault();e.stopPropagation();z.classList.remove('over');addShots(z.dataset.shot,[...e.dataTransfer.files])}})}
document.addEventListener('paste',e=>{const fs=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;
  if(activeShot&&document.querySelector(`[data-shot="${activeShot}"]`)){e.preventDefault();addShots(activeShot,fs)}
  else if($('#drop')){e.preventDefault();addImages(fs)}
  else toast('Нажми на поле «+ Скриншот» и вставь ещё раз')});

/* ---------- экспорт ---------- */
function val(q){const [k,,,type,o]=q,v=A[k];
  if(type==='images')return (v||[]).length?`${v.length} картинок приложено (кнопка «Скачать картинки»)`:'—';
  if(type==='shots'){const n=shotArr('f:'+k).length;return n?`${n} скриншот(ов), файлы ${STEPS.find(s=>s.qs&&s.qs.includes(q)).id}_${k}_N.jpg`:'—'}
  if(type==='slider')return typeof v==='number'?v+' из 5':'—';
  if(type==='table'){const rows=(v||[]).map((r,i)=>[r,i]).filter(([r])=>filled(r)||(r.shots||[]).length);if(!rows.length)return '—';
    return rows.map(([r,i])=>`${i+1}) `+o.cols.filter(c=>String(r[c.f]??'').trim()).map(c=>`${c.l}: ${r[c.f]}`).concat((r.shots||[]).length?[`скриншоты: ${r.shots.length}`]:[]).join('\n   ')).join('\n')}
  if(Array.isArray(v))return v.length?v.join(', '):'—';return v||'—'}
function exportText(){const pics=allPics().length;let t='ОТВЕТЫ — «От смысла к контенту»\n'+new Date().toLocaleDateString('ru-RU')+'\nКартинок и скриншотов: '+pics+(pics?' (файлы — кнопка «Скачать картинки»)':'')+'\n';let lp='';
  STEPS.forEach(s=>{if(s.p!==lp){lp=s.p;t+=`\n=== ${s.p}. ${PHASES[s.p].toUpperCase()} ===\n\n`}
    if(s.qs){const qs=s.qs.filter(q=>q[3]!=='weak'&&(q[3]!=='copy'||A[q[0]]!=null));if(qs.length){t+='## '+s.title+'\n';qs.forEach(q=>t+=`- ${q[1]}${q[3]==='copy'?' (моя версия)':''}\n  ${String(val(q)).replace(/\n/g,'\n  ')}\n`);t+='\n'}}
    if(s.likes){t+='## Мне нравится\n'+(A.likes.map((a,i)=>`${i+1}. ${a.name||'—'} — ${a.url||'—'}${(a.shots||[]).length?` (скриншоты: ${a.shots.length})`:''}\n`+(a.items||[]).map((v,j)=>`   ${i+1}.${j+1} ${v.url||'—'}\n      нравится: ${(v.what||[]).join(', ')||'—'}\n      комментарий: ${v.note||'—'}${(v.shots||[]).length?`\n      скриншоты: ${v.shots.length}`:''}`).join('\n')).join('\n')||'—')+'\n\n'}});
  const n=needList();t+='=== ЧЕГО ПОКА НЕ ХВАТАЕТ ===\n'+(n.length?n.map(x=>'- '+x).join('\n'):'всё основное есть')+'\n';return t}
function needList(){const n=[],has=k=>{const v=A[k];return Array.isArray(v)?v.length>0:!!String(v??'').trim()},rows=k=>(A[k]||[]).filter(filled).length;
  if(!has('d_product')&&!has('w_product')&&!has('niche'))n.push('описание продукта (что, кому, за сколько) — без него позиционирование и прогрев будут с пробелами');
  if(!has('survey'))n.push('ответы опроса — минимум 30');
  const c=rows('cd');if(c<10)n.push(`интервью: заметки по ${c} из 10`);
  const k=rows('compT');if(k<3)n.push(`конкуренты: ${k} из минимум 3 (лучше 10–15)`);
  const u=Object.keys(A).filter(x=>/^u\d+$/.test(x)&&has(x)).length;if(u<23)n.push(`распаковка: ${u} из 23 ответов`);
  if(!has('ex_texts')&&!has('d_bestposts')&&!String(A.ex_have||'').startsWith('да'))n.push('свои тексты или выгрузка канала — чтобы писать твоим голосом');
  if(!has('formats'))n.push('выбор форматов');
  if(rows('storylines')<4)n.push(`сюжетные линии: ${rows('storylines')} из 4–6`);
  if(!has('bu_link'))n.push('большая единица контента (эфир, видео, статья) — для контент-водопада');
  return n}

/* ---------- диктовка ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function dictate(b){if(!SR){toast('Диктовка работает в Chrome/Edge');return}if(rec){rec.stop();return}const f=document.getElementById(b.dataset.mic);rec=new SR();rec.lang='ru-RU';rec.continuous=true;rec.interimResults=true;
  const base=f.value?f.value+' ':'';let fin='';b.classList.add('rec');rec.onresult=e=>{let im='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else im+=r[0].transcript}f.value=base+fin+im;f.dispatchEvent(new Event('input'))};
  rec.onend=()=>{b.classList.remove('rec');rec=null};rec.onerror=()=>toast('Микрофон недоступен');rec.start()}
render();
</script>
<script>
/* ---- Telegram Mini App ---- */
const SUBMIT_URL='https://script.google.com/macros/s/AKfycbwTb0Lfc338SWLud2qBYIImA-h7iaMdJwKUIdY1g9_CubW_oucb040V8Zz_YRAUAUfM9w/exec';
const TG=window.Telegram&&window.Telegram.WebApp;
const IN_TG=!!(TG&&TG.initData);
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#f6efe7');TG.setBackgroundColor('#f6efe7')}catch(e){}}
if(IN_TG)document.documentElement.classList.add('tg');
async function sendAnswers(btn){
  if(!SUBMIT_URL||SUBMIT_URL.startsWith('__')){alert('Отправка ещё не подключена — нажми «Скопировать ответы» и пришли их автору.');return}

  const payload={initData:IN_TG?TG.initData:'',user:(IN_TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)||null,
    text:exportText(),answers:Object.fromEntries(Object.entries(A).filter(([k])=>!/images|shots/i.test(k))),pics:allPics().map(p=>({n:p.n,d:p.d})),sent:new Date().toISOString()};
  try{await fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});

  catch(e){btn.disabled=false;btn.textContent='Отправить ✈';alert('Не получилось отправить. Проверь интернет и попробуй ещё раз — или нажми «Скопировать ответы».')}}
document.addEventListener('click',e=>{const b=e.target.closest('#sendTg');if(b)sendAnswers(b)});
</script>
